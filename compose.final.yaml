# Project-scoped Compose stack: rust-github-action-final.
# Build inputs come from tracked .devcontainer/.env; from the repo root pass --env-file .devcontainer/.env.
# Keep credentials in ignored .devcontainer/.env.local; from the repo root pass it as a second --env-file when present.
## Docker compose file fragment
## Use it to override compose.yaml
name: rust-github-action-final
services:
  rust-github-action-app:
    build:
      target: final
      args:
        APP_NAME: ${APP_NAME:?Set APP_NAME in .devcontainer/.env or the host environment}
        RUST_VERSION: ${RUST_VERSION:?Set RUST_VERSION in .devcontainer/.env or the host environment}
        RUST_ALPINE_VERSION: ${RUST_ALPINE_VERSION:?Set RUST_ALPINE_VERSION in .devcontainer/.env or the host environment}
        ALPINE_VERSION: ${ALPINE_VERSION:?Set ALPINE_VERSION in .devcontainer/.env or the host environment}
        XX_VERSION: ${XX_VERSION:?Set XX_VERSION in .devcontainer/.env or the host environment}
      cache_from:
        - alpine:${ALPINE_VERSION:?Set ALPINE_VERSION in .devcontainer/.env or the host environment}
