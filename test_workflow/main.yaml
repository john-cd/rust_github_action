name: 'Rust GitHub Action test workflow'
on:
  push:
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
## Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
## However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "test_workflow"
  cancel-in-progress: false
jobs:
  test_job:
    runs-on: ubuntu-latest
    name: A test job
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Create a Docker image from the code
        id: create_docker_image
        uses: ./
        #with:
      - name: Output file path
        env:
          ACTION_OUTPUT_FILE_PATH: ${{ steps.create_docker_image.outputs.output_file_path }}
        run: printf '%s\n' "$ACTION_OUTPUT_FILE_PATH"
        shell: bash
      - name: List directory
        run: ls -la
