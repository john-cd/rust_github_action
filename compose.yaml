# Project-scoped Compose stack: rust-github-action.
# Build inputs come from tracked .devcontainer/.env; from the repo root pass --env-file .devcontainer/.env.
# Keep credentials in ignored .devcontainer/.env.local; from the repo root pass it as a second --env-file when present.
# Docker compose reference guide at https://docs.docker.com/go/compose-spec-reference/
# For examples, see the Awesome Compose repository: https://github.com/docker/awesome-compose
name: rust-github-action
services:
  rust-github-action-app:
    platform: linux/amd64
    build:
      context: .   # relative to the location of the (first) Compose file (if more than 1 are specified with -f).
      target: build
      cache_from:
        - rust:${RUST_VERSION:?Set RUST_VERSION in .devcontainer/.env or the host environment}-alpine
        #- type=local,dest=./.cache
        - type=gha
      cache_to:
        #- type=local,dest=./.cache
        - type=gha,mode=max
      args:
        RUST_VERSION: ${RUST_VERSION:?Set RUST_VERSION in .devcontainer/.env or the host environment}
        APP_NAME: ${APP_NAME:?Set APP_NAME in .devcontainer/.env or the host environment}
