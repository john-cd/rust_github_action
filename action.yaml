name: 'Rust GitHub Action'
description: 'GitHub Action that builds Rust code and creates a thin Docker image'
inputs:
  app-name:
    description: 'App name (from Cargo.toml)'
    required: true
    default: 'test_app'
  project-path:
    description: 'Path to the Cargo project, relative to the checked-out repository root'
    required: true
    default: '.'
  output-file-name:
    description: 'Name of the output file (without extension)'
    required: true
    default: 'app'
outputs:
  output_file_path:
    description: "Output file path"
    value: ${{ steps.save.outputs.output_file_path }}
runs:
  using: "composite"
  steps:
    - name: Check Runner OS
      if: ${{ runner.os != 'Linux' }}
      shell: bash
      run: |
        echo "::error title=⛔ error hint::Support Linux Only"
        exit 1
    # - name: List Paths (debug)
    #   run: |
    #     echo "PATH = $PATH"
    #     echo "Workspace = ${{ github.workspace }}"
    #     echo "Action path = ${{ github.action_path }}"
    #   shell: bash
    - name: Build the container
      env:
        ACTION_APP_NAME: ${{ inputs.app-name }}
        ACTION_PROJECT_PATH: ${{ inputs.project-path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        app_name="$ACTION_APP_NAME"
        if [[ ! "$app_name" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]; then
          echo "::error title=Invalid app-name::Use only ASCII letters, digits, underscores, and hyphens." >&2
          exit 1
        fi
        project_path="$ACTION_PROJECT_PATH"
        workspace_path="$(realpath -e -- "$GITHUB_WORKSPACE")"
        if [[ "$project_path" = /* ]]; then
          echo "::error title=Invalid project-path::Use a relative Cargo project path within the checked-out repository." >&2
          exit 1
        fi
        if ! source_path="$(realpath -e -- "$workspace_path/$project_path")"; then
          echo "::error title=Invalid project-path::The project directory does not exist within the checked-out repository." >&2
          exit 1
        fi
        case "$source_path" in
          "$workspace_path"|"$workspace_path"/*) ;;
          *)
            echo "::error title=Invalid project-path::Use a Cargo project directory within the checked-out repository." >&2
            exit 1
            ;;
        esac
        if [[ ! -f "$source_path/Cargo.toml" ]]; then
          echo "::error title=Invalid project-path::The selected project directory must contain Cargo.toml." >&2
          exit 1
        fi
        set -a
        source "$ACTION_PATH/.devcontainer/.env"
        set +a
        docker build --target final --tag final-app \
          --build-arg "RUST_VERSION=${RUST_VERSION}" \
          --build-arg "RUST_ALPINE_VERSION=${RUST_ALPINE_VERSION}" \
          --build-arg "ALPINE_VERSION=${ALPINE_VERSION}" \
          --build-arg "XX_VERSION=${XX_VERSION}" \
          --build-arg "APP_NAME=${app_name}" \
          --platform linux/amd64 \
          --cache-from "rust:${RUST_VERSION}-alpine${RUST_ALPINE_VERSION}" \
          --cache-from "alpine:${ALPINE_VERSION}" \
          --cache-from "type=gha,scope=rust-github-action" \
          --cache-to "type=gha,mode=max,scope=rust-github-action,ignore-error=true" \
          --file "$ACTION_PATH/Dockerfile" "$source_path"
      shell: bash
    - name: Display built images (debug)
      run: docker image ls
      shell: bash
    - name: Save the container
      id: save
      env:
        ACTION_OUTPUT_FILE_NAME: ${{ inputs.output-file-name }}
      run: |
        set -euo pipefail
        output_file_name="$ACTION_OUTPUT_FILE_NAME"
        if [[ ! "$output_file_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          echo "::error title=Invalid output-file-name::Use only ASCII letters, digits, dots, underscores, and hyphens; start with a letter or digit." >&2
          exit 1
        fi
        archive_path="$GITHUB_WORKSPACE/${output_file_name}.tar.zip"
        docker save final-app | zip "$archive_path" -
        printf 'output_file_path=%s\n' "$archive_path" >> "$GITHUB_OUTPUT"
      shell: bash
branding:
  icon: 'package'
  color: 'green'
