[build]
# Just supplies absolute per-checkout paths. On Windows, direct Cargo uses the target/build
# links created by `just build-setup`.
rustc-wrapper = "sccache"
target-dir = "target"
build-dir = "build"
incremental = false

[env]
SCCACHE_BASEDIRS = { value = ".", relative = true }
[env.SCCACHE_CACHE_SIZE]
value = "45G"
force = true
