# Linker policy: use rustc's target defaults for native builds.
# Windows MSVC: use link.exe from Visual Studio Build Tools and the Windows SDK.
# macOS: use the Apple toolchain via cc and the Xcode or Command Line Tools SDK.
# x86_64 GNU/Linux: Rust 1.90+ selects bundled LLD through the system C driver.
# Other Linux targets use their target defaults. Set cross-linkers in local
# Cargo configuration or CARGO_TARGET_<TRIPLE>_LINKER for the selected toolchain.

[build]
# Just supplies absolute per-checkout paths. On Windows, direct Cargo uses the target/build
# links created by `just build-setup`.
rustc-wrapper = "sccache"
target-dir = "target"
build-dir = "build"
incremental = false

[env]
SCCACHE_BASEDIRS = { value = ".", relative = true }

[env.SCCACHE_CACHE_SIZE]
value = "45G"
force = true

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.debug]
debug = 2

[profile.debug.package."*"]
opt-level = 1
debug = 0

[profile.ci]
inherits = "dev"


# Cargo defaults reference (Cargo 1.100.0). Comments only.
#
# [build]
# target = <host>
# target-dir = "target"
# build-dir = <unset; defaults to target-dir>
# rustc-wrapper = <unset>
# incremental = <profile default>
#
# [env]
# <variable> = <unset>
#
# [net]
# retry = 3
# git-fetch-with-cli = false
# offline = false
#
# [term]
# quiet = false
# verbose = false
# color = "auto"
# hyperlinks = true
# unicode = true
# progress.when = "auto"
# progress.width = 80
# progress.term-integration = true
#
# [alias]
# b = "build"
# c = "check"
# d = "doc"
# t = "test"
# r = "run"
# rm = "remove"
#
# [profile.dev]
# opt-level = 0
# debug = true
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = true
# overflow-checks = true
# lto = false
# panic = "unwind"
# incremental = true
# codegen-units = 256 when incremental is enabled; otherwise 16
# rpath = false
#
# [profile.dev.package."*"]
# opt-level = 0
#
# [profile.dev.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.debug]
# inherits = "dev"
#
# [profile.test]
# inherits = "dev"
#
# [profile.release]
# opt-level = 3
# debug = false
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = false
# overflow-checks = false
# lto = false
# panic = "unwind"
# incremental = false
# codegen-units = 16
# rpath = false
#
# [profile.release.package."*"]
# opt-level = 3
#
# [profile.release.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.bench]
# inherits = "release"
